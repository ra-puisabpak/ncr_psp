name: Deploy Puisabpak NCR API (Worker)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Test and deploy to Cloudflare Workers
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run API tests
        working-directory: worker
        run: node --no-warnings test.mjs

      # Every statement in schema.sql is CREATE ... IF NOT EXISTS or INSERT OR IGNORE,
      # so applying it again only adds what is new and never touches existing records.
      - name: Apply database schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute puisabpak-ncr --remote --file=schema.sql

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            SETUP_KEY
        env:
          SETUP_KEY: ${{ secrets.SETUP_KEY }}
