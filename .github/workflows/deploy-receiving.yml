name: Deploy Puisabpak Receiving App (Worker)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'receiving/**'
      - '.github/workflows/deploy-receiving.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: receiving
