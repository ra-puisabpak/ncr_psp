name = "puisabpak-ncr-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "puisabpak-ncr"
database_id = "9622b468-e02b-46a2-8848-784bd676d2a0"

[vars]
ENVIRONMENT = "production"
# Web addresses allowed to call this API from a browser (comma separated, no trailing slash).
ALLOWED_ORIGINS = "https://puisabpak-ncr.pages.dev,https://puisabpak-receiving.rapuisabpak.workers.dev"

# Secret (set from the GitHub secret SETUP_KEY by the deploy workflow): SETUP_KEY

# Keep request logs so problems can be traced in the Cloudflare dashboard.
[observability]
enabled = true
