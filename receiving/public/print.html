<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>พิมพ์เอกสาร FM-QC-001</title>
</head>
<body style="font-family:sans-serif;padding:24px;color:#0f2744">
<p id="m">กำลังเปิดเอกสาร...</p>
<script>
// The receiving app leaves the document to print in this browser's own storage; this page shows it at a
// normal web address, because phones cannot print a page opened from a pop-up or a blob: address.
(function () {
  var key = location.hash.slice(1);
  function show(html) {
    if (!html) { document.getElementById('m').textContent = 'ไม่พบเอกสาร กรุณากลับไปที่แอปแล้วกดพิมพ์ใหม่'; return; }
    document.open(); document.write(html); document.close();
    var inApp = !!(navigator.standalone || (window.matchMedia && ['standalone', 'fullscreen', 'minimal-ui'].some(function (m) { return matchMedia('(display-mode: ' + m + ')').matches; })));
    if (!inApp) return;
    // Opened from the home-screen icon there is no browser bar, so the page needs its own way back.
    var bar = document.createElement('div');
    bar.className = 'no-print';
    bar.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:200;display:flex;gap:8px;padding:10px;background:#0f2744;font-family:Sarabun,sans-serif';
    var st = 'flex:1;padding:12px 6px;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit';
    bar.innerHTML = '<button id="_bk" style="' + st + ';background:#e2e8f0;color:#0f2744">\u2190 กลับ</button><button id="_pr" style="' + st + ';flex:2;background:#0d7a5f;color:#fff">\uD83D\uDDA8 พิมพ์ / บันทึก PDF</button>';
    var gap = document.createElement('div'); gap.className = 'no-print'; gap.style.height = '64px';
    document.body.insertBefore(gap, document.body.firstChild);
    document.body.appendChild(bar);
    document.getElementById('_bk').onclick = function () { if (history.length > 1) history.back(); else location.replace('./'); };
    document.getElementById('_pr').onclick = function () { window.print(); };
    var old = document.querySelector('.print-btn, .pb'); if (old) old.style.display = 'none';
  }
  try {
    var rq = indexedDB.open('fmqc001_print', 1);
    rq.onupgradeneeded = function () { rq.result.createObjectStore('docs'); };
    rq.onerror = function () { show(null); };
    rq.onsuccess = function () {
      var g = rq.result.transaction('docs').objectStore('docs').get(key);
      g.onsuccess = function () { show(g.result); };
      g.onerror = function () { show(null); };
    };
  } catch (e) { show(null); }
})();
</script>
</body>
</html>
